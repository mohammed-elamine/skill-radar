# docker-compose.yml
#
# Local-first lakehouse stack (production-aligned):
# - MinIO (S3-compatible storage) + init buckets
# - Spark "submit" container configured for S3A + Iceberg (Hadoop catalog)
# - Optional: Airflow (profile: airflow)
# - Optional: Elasticsearch + Kibana (profile: search) — add when you have Gold tables to index
#
# Data layout inside the lake bucket:
#   s3a://skillradar-lake/data/<layer>/<domain>/<source>/<entity>/...
#
# Usage:
#   docker compose up -d
#   docker compose --profile airflow up -d
#   docker compose --profile search up -d
#
# Then run Spark jobs from the spark container:
#   docker compose exec spark bash
#   spark-submit /opt/skillradar/jobs/examples/iceberg_smoke_test.py

name: skillradar

services:
  # -----------------------------
  # 1) S3-compatible object store
  # -----------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Bucket initialization (idempotent)
  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SKILLRADAR_S3_BUCKET: ${SKILLRADAR_S3_BUCKET:-skillradar-lake}
      SKILLRADAR_S3_LOGS_BUCKET: ${SKILLRADAR_S3_LOGS_BUCKET:-skillradar-logs}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/$$SKILLRADAR_S3_BUCKET || true;
      mc mb -p local/$$SKILLRADAR_S3_LOGS_BUCKET || true;
      echo 'MinIO buckets ensured: ' $$SKILLRADAR_S3_BUCKET ', ' $$SKILLRADAR_S3_LOGS_BUCKET;
      "

  # -----------------------------
  # 2) Spark submit node
  # -----------------------------
  # Production-aligned Spark container:
  # - Python 3.11 with uv for dependency management
  # - Pre-baked Iceberg/Hadoop jars (no Ivy at runtime)
  # - Clean logs via log4j2.properties
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: skillradar-spark:3.5.7-uv
    working_dir: /opt/skillradar
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully

    environment:
      # Credentials used by Hadoop S3A connector to speak to MinIO (Spark reads these env vars)
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-3}

      # Adzuna API credentials (read from .env by Docker Compose interpolation)
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}

      JAVA_HOME: /opt/java/openjdk
      PATH: /opt/java/openjdk/bin:/opt/skillradar/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      # Make your Python package importable (src/ layout)
      PYTHONPATH: /opt/skillradar/src

      # PySpark Python interpreter (use the venv with our dependencies)
      PYSPARK_PYTHON: /opt/skillradar/.venv/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/skillradar/.venv/bin/python

    volumes:
      - ./pyproject.toml:/opt/skillradar/pyproject.toml:ro
      - ./uv.lock:/opt/skillradar/uv.lock:ro
      - ./jobs:/opt/skillradar/jobs
      - ./src:/opt/skillradar/src
      - ./configs:/opt/skillradar/configs
      - ./logs:/opt/skillradar/logs

      # Manual ingest dropzone: host downloads → container sees read-only
      # Usage: place files in ./data/incoming/<dataset>/ on host
      - ./data/incoming:/opt/skillradar/incoming:ro

      # Spark configuration (mounts override baked-in defaults for dev iteration)
      - ./configs/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./configs/log4j2.properties:/opt/spark/conf/log4j2.properties:ro

    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
      echo 'Spark container ready.';
      echo 'Try: spark-submit /opt/skillradar/jobs/examples/iceberg_smoke_test.py';
      tail -f /dev/null
      "

  # -----------------------------
  # 3) Optional: Airflow (profile)
  # -----------------------------
  # Airflow is the control-plane orchestrator. It does NOT run Spark/Java
  # itself — it launches ephemeral containers from the Spark image via
  # DockerOperator. See docs/platform/airflow.md for details.
  #
  # Shared environment block (YAML anchor) for all Airflow services.
  # Contains Airflow core config + env vars forwarded to DAG code.
  airflow-postgres:
    profiles: ["airflow"]
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    # Port not exposed to host by default — only Airflow services need it.
    # Override with AIRFLOW_DB_PORT in .env if you need local psql access.
    ports:
      - "${AIRFLOW_DB_PORT:-5433}:5432"
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 3s
      retries: 30

  airflow-init:
    profiles: ["airflow"]
    build:
      context: docker/airflow
      dockerfile: Dockerfile
      network: host
    image: skillradar-airflow:2.9.3
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow_env
      # --- Airflow core ---
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-to-a-long-random-secret}
      # --- Credentials forwarded to DAG config (DockerOperator env) ---
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-3}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      # --- Skill Radar orchestration config ---
      SKILLRADAR_S3_BUCKET: ${SKILLRADAR_S3_BUCKET:-skillradar-lake}
      SKILLRADAR_S3_LOGS_BUCKET: ${SKILLRADAR_S3_LOGS_BUCKET:-skillradar-logs}
      SKILLRADAR_S3_ENDPOINT_DOCKER: ${SKILLRADAR_S3_ENDPOINT_DOCKER:-http://minio:9000}
      SKILLRADAR_DOCKER_NETWORK: ${SKILLRADAR_DOCKER_NETWORK:-skillradar_default}
      SKILLRADAR_SPARK_IMAGE: ${SKILLRADAR_SPARK_IMAGE:-skillradar-spark:3.5.7-uv}
      # Host project root for DockerOperator bind mounts.
      # Docker Compose interpolates $PWD to the host directory at 'up' time.
      SKILLRADAR_HOST_PROJECT_DIR: ${SKILLRADAR_HOST_PROJECT_DIR:-${PWD}}
      # --- Admin bootstrap (used by airflow-init command) ---
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      # --- Pool bootstrap ---
      SKILLRADAR_SPARK_POOL: ${SKILLRADAR_SPARK_POOL:-spark_containers}
      SKILLRADAR_SPARK_POOL_SLOTS: ${SKILLRADAR_SPARK_POOL_SLOTS:-2}
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        echo "Running Airflow DB migration..."
        airflow db migrate
        if airflow users list 2>/dev/null | grep -qw "$$AIRFLOW_ADMIN_USER"; then
          echo "Airflow admin user already exists: $$AIRFLOW_ADMIN_USER"
        else
          echo "Creating Airflow admin user: $$AIRFLOW_ADMIN_USER"
          airflow users create \
            --username "$$AIRFLOW_ADMIN_USER" \
            --password "$$AIRFLOW_ADMIN_PASSWORD" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com
          echo "Airflow admin user created successfully."
        fi
        echo "Ensuring Spark container pool: $$SKILLRADAR_SPARK_POOL ($$SKILLRADAR_SPARK_POOL_SLOTS slots)"
        airflow pools set \
          "$$SKILLRADAR_SPARK_POOL" \
          "$$SKILLRADAR_SPARK_POOL_SLOTS" \
          "Limits concurrent Spark/DockerOperator containers across all DAGs"
        echo "Pool ready."

  airflow-webserver:
    profiles: ["airflow"]
    image: skillradar-airflow:2.9.3
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow_env
    ports:
      - "${AIRFLOW_WEB_PORT:-8085}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: bash -lc "airflow webserver"

  airflow-scheduler:
    profiles: ["airflow"]
    image: skillradar-airflow:2.9.3
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark:
        condition: service_started
    environment:
      <<: *airflow_env
    # Supplementary group for Docker socket access.
    # Default GID 0 works on Docker Desktop (macOS/Windows).
    # On Linux, set DOCKER_GID to the output of: stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      # Docker socket: required for DockerOperator to launch Spark containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Operational scripts (smoke checks, etc.)
      - ./scripts/airflow:/opt/airflow/scripts:ro
    command: bash -lc "airflow scheduler"

  # -----------------------------
  # 4) Optional: Elasticsearch + Kibana (profile)
  # -----------------------------
  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    profiles: ["search"]
    image: docker.elastic.co/kibana/kibana:8.13.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30

volumes:
  minio_data:
  airflow_db:
  airflow_logs:
  es_data:
