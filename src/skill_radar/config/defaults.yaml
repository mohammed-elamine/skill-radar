platform:
  environment: local

storage:
  s3:
    bucket: skillradar-lake
    endpoint_host: http://localhost:9000
    endpoint_docker: http://minio:9000
    region: eu-west-3
    secure: false
    additional_buckets: []  # extra buckets beyond lake + logs
  iceberg:
    catalog_name: sr
    namespace_prefix: sr
    warehouse: s3a://skillradar-lake/warehouse
    required_namespaces:
      - sr_bronze
      - sr_silver
      - sr_gold

lake:
  root_prefix: data
  layers:
    landing: landing
    bronze: bronze
    silver: silver
    gold: gold

manifest:
  schema_version: "1.0.0"

logging:
  level: INFO
  log_dir: logs
  console_format: text
  file_format: json
  upload: false
  logs_bucket: skillradar-logs

adzuna:
  base_url: https://api.adzuna.com/v1/api
  default_country: fr
  results_per_page: 50
  max_pages_per_run: 20
  request_timeout_seconds: 30
  max_retries: 3
  backoff_seconds: 2
  default_preset: default_fr

search:
  enabled: true
  elasticsearch_url: http://localhost:9200
  elasticsearch_url_docker: http://elasticsearch:9200
  kibana_url: http://localhost:5601
  kibana_url_docker: http://kibana:5601
  index_prefix: skillradar
  index_replicas: 0
  index_shards: 1
  request_timeout_seconds: 30
  bulk_chunk_size: 500
  bulk_max_retries: 3
  bulk_retry_backoff_seconds: 2
  country_default: fr
  dashboard_bootstrap_enabled: false
  create_index_if_missing: true
  use_tls: false
  indices:
    skill_demand_daily: skill-demand-daily
    salary_by_skill_daily: salary-by-skill-daily
    occupation_skill_graph: occupation-skill-graph
    job_skill_matches: job-skill-matches
    job_occupation_matches: job-occupation-matches

validation:
  esco:
    silver:
      min_relation_fk_coverage: 0.99
