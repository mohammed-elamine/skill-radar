platform:
  environment: local

storage:
  s3:
    bucket: skillradar-lake
    endpoint_host: http://localhost:9000
    endpoint_docker: http://minio:9000
    region: eu-west-3
    secure: false
    additional_buckets: []  # extra buckets beyond lake + logs
  iceberg:
    catalog_name: sr
    namespace_prefix: sr
    warehouse: s3a://skillradar-lake/warehouse
    required_namespaces:
      - sr_bronze
      - sr_silver
      - sr_gold

lake:
  root_prefix: data
  layers:
    landing: landing
    bronze: bronze
    silver: silver
    gold: gold

manifest:
  schema_version: "1.0.0"

logging:
  level: INFO
  log_dir: logs
  console_format: text
  file_format: json
  upload: false
  logs_bucket: skillradar-logs

adzuna:
  base_url: https://api.adzuna.com/v1/api
  default_country: fr
  results_per_page: 50
  max_pages_per_run: 20
  request_timeout_seconds: 30
  max_retries: 3
  backoff_seconds: 2
  default_preset: default_fr

validation:
  esco:
    silver:
      min_relation_fk_coverage: 0.99
