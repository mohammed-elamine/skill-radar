dataset: esco

artifact:
  type: zip
  content: classification
  file_type: csv

supported_languages:
  - fr
  - en

version_pattern: "^v\\d+\\.\\d+\\.\\d+$"

entities:
  - name: skills
    filename_pattern: "skills_{lang}.csv"
    required_columns:
      - conceptUri
      - preferredLabel
      - altLabels
      - hiddenLabels
      - description
      - skillType
      - reuseLevel
    renames:
      conceptUri: concept_uri
      preferredLabel: preferred_label
      altLabels: alt_labels_raw
      hiddenLabels: hidden_labels_raw
      description: description
      skillType: skill_type
      reuseLevel: reuse_level
    newline_fields:
      - altLabels
      - hiddenLabels
    derived_newline_helpers: true

  - name: occupations
    filename_pattern: "occupations_{lang}.csv"
    required_columns:
      - conceptUri
      - preferredLabel
      - altLabels
      - hiddenLabels
      - description
    renames:
      preferredLabel: preferred_label
      altLabels: alt_labels_raw
      hiddenLabels: hidden_labels_raw
      description: description
      conceptUri: concept_uri
    newline_fields:
      - altLabels
      - hiddenLabels
    derived_newline_helpers: true

  - name: relations
    filename_pattern: "occupationSkillRelations_{lang}.csv"
    required_columns:
      - occupationUri
      - occupationLabel
      - relationType
      - skillType
      - skillLabel
      - skillUri
    renames:
      occupationLabel: occupation_label
      occupationUri: occupation_uri
      relationType: relation_type
      skillType: skill_type
      skillLabel: skill_label
      skillUri: skill_uri
    newline_fields: []
    derived_newline_helpers: false

source:
  provider: ESCO
  acquisition_method: manual_download
  provider_url: https://esco.ec.europa.eu
