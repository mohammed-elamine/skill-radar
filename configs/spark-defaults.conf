# configs/spark-defaults.conf
# -----------------------------------------------------------------------------
# Production-aligned Spark configuration for SkillRadar lakehouse.
#
# Jars: Pre-baked into the Docker image (no Ivy resolution at runtime).
# Logging: Configured via log4j2.properties for clean output.
# Storage: MinIO via S3A connector with Iceberg Hadoop catalog.
# -----------------------------------------------------------------------------

# ===========================
# Logging & Console (clean output)
# ===========================
# Disable console progress bars (removes "[Stage X:> ..." noise)
spark.ui.showConsoleProgress=false

# Point to log4j2 config for both driver and executors
spark.driver.extraJavaOptions=-Dlog4j.configurationFile=/opt/spark/conf/log4j2.properties -XX:ErrorFile=/opt/skillradar/logs/jvm/hs_err_pid%p.log
spark.executor.extraJavaOptions=-Dlog4j.configurationFile=/opt/spark/conf/log4j2.properties -XX:ErrorFile=/opt/skillradar/logs/jvm/hs_err_pid%p.log

# ===========================
# Spark + MinIO (S3A) settings
# ===========================
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem

# (Recommended) stability settings
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.connection.maximum=100
spark.hadoop.fs.s3a.attempts.maximum=10

# ===========================
# Iceberg catalog (Hadoop catalog) settings
# ===========================
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Catalog name: sr (Skill Radar)
spark.sql.catalog.sr=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.sr.type=hadoop
spark.sql.catalog.sr.warehouse=s3a://skillradar-lake/warehouse

# (Optional) safer defaults
spark.sql.catalogImplementation=in-memory
spark.sql.defaultCatalog=sr
spark.sql.session.timeZone=UTC
