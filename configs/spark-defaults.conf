# Download these jars automatically for every spark-submit / pyspark
spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,org.apache.hadoop:hadoop-aws:3.3.4

# Put Ivy cache somewhere persistent (and mounted as a Docker volume)
spark.jars.ivy=/tmp/.ivy2

# ===========================
# Spark + MinIO (S3A) settings
# ===========================
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem

# (Optional but recommended) stability
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.connection.maximum=100
spark.hadoop.fs.s3a.attempts.maximum=10

# ===========================
# Iceberg catalog (Hadoop catalog) settings
# ===========================
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Catalog name: sr (Skill Radar)
spark.sql.catalog.sr=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.sr.type=hadoop
spark.sql.catalog.sr.warehouse=s3a://skillradar-lake/warehouse

# (Optional) safer defaults
spark.sql.catalogImplementation=in-memory
spark.sql.defaultCatalog=sr
