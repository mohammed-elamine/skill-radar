# /opt/spark/conf/log4j2.properties
# Log4j2 (properties) config for Spark 3.5.x

status = error
name = SkillRadarSparkLog4j2

# -----------------------
# Appenders
# -----------------------
appenders = console

appender.console.type = Console
appender.console.name = CONSOLE
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
# IMPORTANT:
#  - keep it simple
#  - avoid throwable formatting tokens here to prevent formatting crashes
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1}] %m%n

# -----------------------
# Root logger
# -----------------------
rootLogger.level = warn
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = CONSOLE

# -----------------------
# Noise reduction
# -----------------------
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error

logger.hadoopS3a.name = org.apache.hadoop.fs.s3a
logger.hadoopS3a.level = error

logger.aws.name = com.amazonaws
logger.aws.level = error

logger.awssdk.name = software.amazon.awssdk
logger.awssdk.level = error

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = error

logger.sparkjetty.name = org.sparkproject.jetty
logger.sparkjetty.level = error

logger.parquet.name = org.apache.parquet
logger.parquet.level = error

logger.hive.name = org.apache.hive
logger.hive.level = error

logger.datanucleus.name = DataNucleus
logger.datanucleus.level = error

# -----------------------
# Your app logs
# -----------------------
logger.skillradar.name = skill_radar
logger.skillradar.level = info

logger.py4j.name = py4j
logger.py4j.level = warn
